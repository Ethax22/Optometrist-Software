services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: optometrist
      POSTGRES_PASSWORD: optometrist
      POSTGRES_DB: optometrist
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U optometrist -d optometrist"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
