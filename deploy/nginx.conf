# nginx reverse proxy for the app. Copy to /etc/nginx/sites-available/optometrist-app,
# symlink into sites-enabled, then run `certbot --nginx` to fill in the TLS block below.
#
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/optometrist-app
#   sudo ln -s /etc/nginx/sites-available/optometrist-app /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d your-domain.example

server {
    listen 80;
    listen [::]:80;
    server_name your-domain.example;

    # certbot will add the TLS server block and redirect here automatically.

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    client_max_body_size 10m; # headroom for signature image uploads
}
